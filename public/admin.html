<!doctype html>
<html lang="en"><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Key Proxy</title>
<script src="https://cdn.jsdelivr.net/npm/i18next@23.7.6/i18next.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
:root{--bg:#f3f4f9;--card:#fff;--card2:#f6f7fb;--fg:#12141c;--mut:#6b7280;--bd:#e3e6ee;--ac:#6366f1;--ac2:#8b5cf6;--bad:#ef4444;--ok:#10b981;--warn:#f59e0b;--sh:0 12px 32px -14px rgba(30,41,59,.22)}
@media(prefers-color-scheme:dark){:root{--bg:#090a0f;--card:#12141e;--card2:#181b29;--fg:#eceef7;--mut:#8b91a8;--bd:#232738;--sh:0 12px 32px -14px rgba(0,0,0,.7)}}
*{box-sizing:border-box}
body{margin:0;font:15px/1.5 "Segoe UI",system-ui,sans-serif;color:var(--fg);min-height:100vh;
background:radial-gradient(1100px 480px at 85% -10%,rgba(99,102,241,.2),transparent),radial-gradient(800px 380px at 0% 0%,rgba(139,92,246,.14),transparent),var(--bg)}
.wrap{max-width:940px;margin:0 auto;padding:22px 16px 60px}
.top{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.logo{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;font-size:23px;color:#fff;background:linear-gradient(135deg,var(--ac),var(--ac2));box-shadow:0 8px 22px -6px rgba(99,102,241,.6)}
.top h1{margin:0;font-size:24px;letter-spacing:.2px;flex:1}
.top h1 small{display:block;font-size:12px;font-weight:400;color:var(--mut)}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:18px 0}
.tile{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:14px 16px;box-shadow:var(--sh)}
.tile b{display:block;font-size:28px;line-height:1.1;background:linear-gradient(135deg,var(--ac),var(--ac2));-webkit-background-clip:text;background-clip:text;color:transparent}
.tile span{color:var(--mut);font-size:13px}
#prog{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px 16px;margin-bottom:14px}
#prog[hidden]{display:none}
.barbg{height:8px;border-radius:99px;background:var(--card2);overflow:hidden;margin-top:8px}
#bar{height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,var(--ac),var(--ac2));transition:width .4s}
.card{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:18px;margin:14px 0;box-shadow:var(--sh)}
.card>h2{margin:0;font-size:17px}
.card>.sub{margin:2px 0 12px;color:var(--mut);font-size:13px}
input,textarea,select{background:var(--card2);color:var(--fg);border:1px solid var(--bd);border-radius:10px;padding:9px 11px;font:inherit;flex:1;min-width:120px;outline:none;transition:border-color .15s,box-shadow .15s}
input:focus,textarea:focus,select:focus{border-color:var(--ac);box-shadow:0 0 0 3px rgba(99,102,241,.2)}
textarea{width:100%;min-height:120px;font:13px/1.6 ui-monospace,Menlo,monospace;resize:vertical;border-style:dashed}
textarea.drag{border-color:var(--ac);background:rgba(99,102,241,.08)}
option{background:var(--card)}
button{border:0;border-radius:10px;padding:9px 16px;cursor:pointer;font:inherit;font-weight:600;color:#fff;background:linear-gradient(135deg,var(--ac),var(--ac2));box-shadow:0 6px 16px -8px rgba(99,102,241,.8);transition:transform .1s,opacity .15s}
button:hover{transform:translateY(-1px)} button:active{transform:none}
button:disabled{opacity:.55;cursor:wait;transform:none}
button.ghost{background:var(--card2);color:var(--fg);border:1px solid var(--bd);box-shadow:none;font-weight:500}
button.bad{background:var(--bad);box-shadow:none}
button.sm{padding:5px 11px;font-size:13px}
.row{display:flex;gap:8px;margin:10px 0;flex-wrap:wrap;align-items:center}
.chips{display:flex;flex-direction:column;gap:6px;margin-top:10px;font-size:13px}
.chip{padding:7px 12px;border-radius:10px;border:1px solid var(--bd);background:var(--card2);display:flex;gap:8px;align-items:center}
.chip.added{border-color:rgba(16,185,129,.5)} .chip.invalid{border-color:rgba(239,68,68,.5)} .chip.unknown{border-color:rgba(245,158,11,.5)}
details.prov{border:1px solid var(--bd);border-radius:14px;margin:10px 0;background:var(--card2);overflow:hidden}
details.prov>summary{display:flex;gap:10px;align-items:center;cursor:pointer;padding:12px 14px;list-style:none}
details.prov>summary::-webkit-details-marker{display:none}
details.prov>summary::after{content:"‹";color:var(--mut);transition:transform .2s;font-size:20px}
details.prov[open]>summary::after{transform:rotate(-90deg)}
.av{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;color:#fff;font-weight:700;font-size:15px;text-transform:uppercase}
details.prov>summary b{flex:1;direction:ltr;text-align:right;font-size:16px}
.pill{font-size:12px;padding:2px 10px;border-radius:99px;border:1px solid var(--bd);color:var(--mut);background:var(--card)}
.pill.ok{color:var(--ok);border-color:rgba(16,185,129,.5)} .pill.bad{color:var(--bad);border-color:rgba(239,68,68,.5)}
.pbody{padding:0 14px 14px}
.tabs{display:flex;gap:4px;margin:2px 0 10px;border-bottom:1px solid var(--bd)}
.tab{background:none;box-shadow:none;color:var(--mut);border-radius:8px 8px 0 0;padding:8px 14px;font-weight:600;border-bottom:2px solid transparent}
.tab.on{color:var(--ac);border-bottom-color:var(--ac)}
.tab:hover{transform:none}
.item{display:flex;gap:10px;align-items:center;padding:8px 4px;border-top:1px solid var(--bd);flex-wrap:wrap}
.item .grow{flex:1;color:var(--mut);font-size:12.5px;min-width:80px}
.dot{width:10px;height:10px;border-radius:50%;background:var(--mut);flex:none;display:inline-block}
.dot.ok{background:var(--ok);box-shadow:0 0 0 3px rgba(16,185,129,.2)} .dot.bad{background:var(--bad);box-shadow:0 0 0 3px rgba(239,68,68,.2)} .dot.unk{background:var(--warn)}
.tag{font-size:11px;padding:1px 8px;border-radius:6px;background:var(--card);border:1px solid var(--bd);color:var(--mut)}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{background:var(--card);color:var(--mut);border:1px solid var(--bd);box-shadow:none;padding:4px 12px;font-size:13px;font-weight:500}
.seg button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.sw{position:relative;width:38px;height:22px;flex:none}
.sw input{opacity:0;width:0;height:0;min-width:0;position:absolute}
.sw i{position:absolute;inset:0;border-radius:99px;background:var(--bd);transition:.2s;cursor:pointer}
.sw i::before{content:"";position:absolute;width:16px;height:16px;top:3px;right:3px;border-radius:50%;background:#fff;transition:.2s}
[dir=rtl] .sw i::before{right:auto;left:3px}
.sw input:checked+i{background:var(--ok)} .sw input:checked+i::before{transform:translateX(-16px)}
[dir=rtl] .sw input:checked+i::before{transform:translateX(16px)}
table{width:100%;border-collapse:collapse} td,th{text-align:right;padding:9px 6px;border-bottom:1px solid var(--bd);font-size:14px} th{color:var(--mut);font-weight:500;font-size:12.5px}
[dir=rtl] td,[dir=rtl] th{text-align:left}
code{direction:ltr;unicode-bidi:embed;word-break:break-all;font-family:ui-monospace,Menlo,monospace;font-size:13px}
.newkey{margin-top:10px;padding:12px;border:1px dashed var(--ac);border-radius:12px;background:rgba(99,102,241,.07)}
.newkey code{display:block;margin:8px 0}
.mut{color:var(--mut)}
#toasts{position:fixed;bottom:18px;left:18px;display:flex;flex-direction:column;gap:8px;z-index:9}
[dir=rtl] #toasts{left:auto;right:18px}
.toast{background:var(--card);border:1px solid var(--bd);border-right:4px solid var(--ac);padding:10px 16px;border-radius:12px;box-shadow:var(--sh);max-width:340px;animation:in .25s}
[dir=rtl] .toast{border-right:1px solid var(--bd);border-left:4px solid var(--ac)}
.toast.ok{border-right-color:var(--ok)} .toast.bad{border-right-color:var(--bad)}
[dir=rtl] .toast.ok{border-left-color:var(--ok);border-right:1px solid var(--bd)}
[dir=rtl] .toast.bad{border-left-color:var(--bad);border-right:1px solid var(--bd)}
@keyframes in{from{opacity:0;transform:translateY(10px)}}
@media(max-width:560px){.tiles{grid-template-columns:1fr 1fr 1fr;gap:8px}.tile b{font-size:22px}}
</style>
<div class="wrap">
  <div class="top">
    <div class="logo">🔑</div>
    <h1 id="title">Key Proxy<small id="subtitle">Loading...</small></h1>
    <button id="langToggle" class="ghost sm" style="margin-left:auto">🇺🇸</button>
    <span id="scan"></span>
  </div>
  <div id="tokenSection" style="margin:15px 0;" hidden>
    <input type="password" id="adminTokenInput" placeholder="Admin Token" 
           style="width:100%; padding:10px; border:1px solid var(--bd); border-radius:8px; background:var(--card2); color:var(--fg); outline:none;">
    <button onclick="saveToken()" style="margin-top:10px; padding:8px 16px; font-size:13px;">حفظ التوكن</button>
  </div>
  <div class="tiles" id="tiles"></div>
  <div id="prog" hidden><b id="barTxt">…</b><div class="barbg"><div id="bar"></div></div></div>
  <div id="app"></div>
</div>
<div id="toasts"></div>
<script>
// i18n initialization
async function initI18n() {
  const savedLang = localStorage.getItem('keyproxy-lang') || 'en';
  
  // Load translation resources
  const [enRes, arRes] = await Promise.all([
    fetch('/locales/en.json').then(r => r.json()),
    fetch('/locales/ar.json').then(r => r.json())
  ]);
  
  await i18next.init({
    lng: savedLang,
    resources: {
      en: { translation: enRes.translation },
      ar: { translation: arRes.translation }
    },
    fallbackLng: 'en'
  });
  
  // Set direction and language toggle
  updateLanguage(savedLang);
  
  // Update UI on language change
  i18next.on('languageChanged', updateLanguage);
}

function updateLanguage(lang) {
  const isRTL = lang === 'ar';
  document.documentElement.dir = isRTL ? 'rtl' : 'ltr';
  document.documentElement.lang = lang;
  
  // Update language toggle button
  const langToggle = document.getElementById('langToggle');
  if (langToggle) {
    langToggle.textContent = lang === 'ar' ? '🇸🇦' : '🇺🇸';
  }
  
  // Update title and subtitle
  const title = document.getElementById('title');
  const subtitle = document.getElementById('subtitle');
  if (title && subtitle && i18next.isInitialized) {
    if (title.firstChild) title.firstChild.textContent = i18next.t('admin.title');
    subtitle.textContent = i18next.t('admin.subtitle');
  }
  
  // Save preference
  localStorage.setItem('keyproxy-lang', lang);
  
  // Re-render to update all text
  if (typeof render === 'function') render();
}

function t(key, options) {
  if (!i18next.isInitialized) return key;
  return i18next.t(key, options);
}

// Make t function globally accessible
window.t = t;

// Language toggle handler
document.addEventListener('DOMContentLoaded', () => {
  const langToggle = document.getElementById('langToggle');
  if (langToggle) {
    langToggle.onclick = () => {
      const currentLang = i18next.language;
      const newLang = currentLang === 'ar' ? 'en' : 'ar';
      i18next.changeLanguage(newLang);
    };
  }
});

const $=(s)=>document.querySelector(s);
const h=(t,a={},...c)=>{const e=document.createElement(t);for(const[k,v]of Object.entries(a)){if(k.startsWith('on'))e.addEventListener(k.slice(2),v);else if(k==='class')e.className=v;else if(v===true)e.setAttribute(k,'');else if(v!==false&&v!=null)e.setAttribute(k,v)}e.append(...c.flat().filter(x=>x!=null&&x!==false));return e};
let S=null,LAST=[];const OPEN=new Set(),UI={};
const ui=n=>UI[n]||(UI[n]={tab:'keys',f:'all',q:'',all:false});
const COL={groq:'#f55036',openrouter:'#7c3aed',gemini:'#2563eb',cerebras:'#0ea5e9',mistral:'#f59e0b',sambanova:'#ea580c',nvidia:'#16a34a',xai:'#111827',fireworks:'#dc2626',huggingface:'#eab308'};
const color=n=>COL[n]||`hsl(${[...n].reduce((a,c)=>a*31+c.charCodeAt(0),7)%360} 62% 48%)`;
async function api(m,p,b){
  let token = new URLSearchParams(window.location.search).get('token');
  if (!token) {
    const tokenInput = document.getElementById('adminTokenInput');
    if (tokenInput) token = tokenInput.value;
  }
  const headers = {'Content-Type': 'application/json'};
  if (token) headers['x-admin-token'] = token;
  const r=await fetch('/admin/api'+p,{method:m,headers,body:b?JSON.stringify(b):undefined});
  if(r.status===401||r.status===403)throw new Error('Invalid admin token. Please enter your admin token.');
  return r.json();
}
function toast(msg,kind=''){const el=h('div',{class:'toast '+kind},msg);$('#toasts').append(el);setTimeout(()=>el.remove(),kind==='bad'?7000:3800)}
async function busy(btn,txt,fn,done){
  btn.disabled=true;btn.textContent=txt;
  try{const r=await fn();if(r&&r.error)toast(r.error,'bad');else if(done)toast(done(r),'ok')}catch(e){toast(e.message,'bad')}
  await render();
}
const copy=async(txt)=>{try{await navigator.clipboard.writeText(txt);toast(window.t('projectKeys.copy'),'ok')}catch{toast(window.t('toasts.copyFailed'),'bad')}};
const st=(m)=>m.ok===true?'ok':m.ok===false?'bad':'unk';
const kst=(k)=>k.status==='valid'?'ok':(k.status==='invalid'||k.status==='nocredit')?'bad':'unk';
const ktxt=(k)=>k.status==='valid'?window.t('provider.valid'):k.status==='invalid'?window.t('provider.invalid'):k.status==='nocredit'?window.t('providers.noCredit'):'Unverified';

async function addKeys(btn,ta){
  if(!ta.value.trim())return;
  btn.disabled=true;btn.textContent=window.t('toasts.detecting');
  try{
    const r=await api('POST','/keys/smart',{text:ta.value});
    if(r.error)toast(r.error,'bad');
    else{
      LAST=r.results;ta.value='';
      for(const n of new Set(r.results.filter(x=>x.status==='added').map(x=>x.provider)))OPEN.add(n);
      toast(window.t('toasts.autoScanning'),'ok');
    }
  }catch(e){toast(e.message,'bad')}
  render();
}
async function fullScan(btn){
  const ps=S.providers.filter(p=>p.keys.some(k=>!k.disabled));
  if(!ps.length)return toast(window.t('toasts.noActiveKeys'),'bad');
  btn.disabled=true;
  for(const p of ps){await api('POST',`/providers/${p.name}/verify`,{});await api('POST',`/providers/${p.name}/rescan`)}
  toast(window.t('toasts.scanStarted'),'ok');render();
}
function chip(r){
  const chipText={
    added:`${r.provider} · …${r.tail} · `+(r.verified?window.t('chips.added'):window.t('chips.addedNotVerified')),
    duplicate:`…${r.tail} ${window.t('chips.duplicate')} ${r.provider}`,
    invalid:`…${r.tail} ${window.t('chips.invalid')} ${r.provider} (HTTP ${r.code||'?'}) ${window.t('chips.notSaved')}`,
    unknown:`…${r.tail} ${window.t('chips.unknown')}`
  }[r.status];
  return h('div',{class:'chip '+r.status},{added:'✅',duplicate:'♻️',invalid:'❌',unknown:'❓'}[r.status],chipText);
}

function keysTab(p){
  const vb=h('button',{class:'ghost sm'},window.t('provider.checkAll'));
  vb.onclick=()=>busy(vb,window.t('provider.checking'),()=>api('POST',`/providers/${p.name}/verify`,{}),r=>`${window.t('provider.valid')}: ${r.results.filter(x=>x.state==='valid').length} · ${window.t('provider.invalid')}: ${r.results.filter(x=>x.state==='invalid').length}`);
  return h('div',{},h('div',{class:'row'},vb),
    ...p.keys.map(k=>{
      const v=h('button',{class:'ghost sm'},window.t('provider.check'));v.onclick=()=>busy(v,'…',()=>api('POST',`/providers/${p.name}/verify`,{id:k.id}),r=>ktxt({status:r.results[0]?.state==='valid'?'valid':r.results[0]?.state==='invalid'?'invalid':''}));
      const tg=h('button',{class:'ghost sm'},k.disabled?window.t('provider.enable'):window.t('provider.disable'));tg.onclick=()=>busy(tg,'…',()=>api('POST',`/providers/${p.name}/keys/${k.id}/toggle`));
      const rm=h('button',{class:'bad sm'},window.t('provider.delete'));rm.onclick=()=>busy(rm,'…',()=>api('DELETE',`/providers/${p.name}/keys/${k.id}`));
      return h('div',{class:'item'},h('i',{class:'dot '+kst(k)}),h('code',{},'…'+k.tail),h('span',{class:'tag'},ktxt(k)),
        h('span',{class:'grow'},`${k.used} ${window.t('provider.requests')} · ${k.errors} ${window.t('provider.errors')}`+(k.cooldown?` · ${window.t('provider.cooldown')} ${k.cooldown}s`:'')+(k.disabled?' · '+window.t('provider.disabled'):'')),v,tg,rm);
    }));
}
function modelsTab(p){
  const all=Object.entries(p.models||{});
  const good=all.filter(([,m])=>m.ok===true).sort((a,b)=>a[0].localeCompare(b[0]));
  const unk=all.filter(([,m])=>m.ok==null).sort((a,b)=>a[0].localeCompare(b[0]));
  const chat=(l)=>l.filter(([,m])=>m.type==='chat').map(([id])=>id);
  const opts=[...chat(good).map(id=>[id,id]),...chat(unk).map(id=>[id,id+' (unconfirmed)'])];
  if(p.defaultModel&&!opts.some(([id])=>id===p.defaultModel))opts.unshift([p.defaultModel,p.defaultModel+' (untested)']);
  const sel=h('select',{},h('option',{value:''},'— '+window.t('provider.selectDefault')+' —'),
    ...opts.map(([id,t])=>h('option',{value:id,selected:id===p.defaultModel},t)));
  sel.onchange=async()=>{const v=sel.value;try{await api('PUT','/providers/'+p.name,{defaultModel:v});toast(v?window.t('toasts.defaultSet',{model:v}):window.t('toasts.defaultUnset'),'ok')}catch(e){toast(e.message,'bad')}render();};
  const rs=h('button',{class:'ghost'},p.scanning?window.t('provider.scanning'):window.t('provider.rescan'));rs.disabled=!!p.scanning;
  rs.onclick=()=>busy(rs,'…',()=>api('POST',`/providers/${p.name}/rescan`),()=>window.t('toasts.scanStarted'));
  const row=([id,m])=>{
    const cb=h('input',{type:'checkbox',checked:m.enabled!==false});cb.onchange=()=>api('POST',`/providers/${p.name}/models/set`,{id,enabled:cb.checked});
    return h('div',{class:'item'},h('i',{class:'dot '+st(m)}),h('code',{},id),h('span',{class:'tag'},m.type),h('span',{class:'grow'},m.err||''),h('label',{class:'sw'},cb,h('i')));
  };
  const when=p.scannedAt?window.t('provider.lastScan')+': '+new Date(p.scannedAt).toLocaleString(document.documentElement.lang):window.t('provider.notScanned');
  return h('div',{},h('div',{class:'row'},sel,rs),
    p.note?h('div',{class:'chip unknown'},'⚠️ '+p.note):null,
    h('p',{class:'mut',style:'font-size:12.5px;margin:4px 0'},(p.scanning?window.t('provider.autoScanning')+' ':window.t(''))+when+(p.locked?' · '+window.t('provider.defaultPinned'):'')),
    ...(good.length?good.map(row):[h('p',{class:'mut'},p.scanning?window.t('provider.discovering'):(p.note?'':window.t('provider.noValidModels')))]),
    unk.length?h('details',{style:'margin-top:10px'},h('summary',{class:'mut'},`${window.t('provider.unconfirmed')} (${unk.length}): ${window.t('provider.rateLimit')}`),...unk.map(row)):null);
}
function settingsTab(p){
  const url=h('input',{value:p.baseUrl||''}),mdl=h('input',{value:p.defaultModel||'',placeholder:window.t('advanced.defaultModel')});
  const sv=h('button',{},window.t('provider.save'));sv.onclick=()=>busy(sv,'…',()=>api('PUT','/providers/'+p.name,{baseUrl:url.value,defaultModel:mdl.value}),()=>window.t('provider.saved'));
  const del=h('button',{class:'bad'},window.t('provider.deleteProvider'));del.onclick=()=>{if(confirm(window.t('provider.deleteConfirm',{name:p.name})))busy(del,'…',()=>api('DELETE','/providers/'+p.name))};
  return h('div',{},h('div',{class:'row'},url,mdl),h('div',{class:'row'},sv,del));
}
function provider(p){
  const u=ui(p.name);
  const ms=Object.values(p.models||{}),okc=ms.filter(m=>m.type==='chat'&&m.ok===true).length;
  const badk=p.keys.filter(k=>k.status==='invalid').length;
  const body=h('div',{class:'pbody'});
  const draw=()=>{
    const tabs=h('div',{class:'tabs'},...[['keys',window.t('provider.keys')],['models',window.t('provider.models')],['set',window.t('provider.settings')]].map(([k,txt])=>{const b=h('button',{class:'tab'+(u.tab===k?' on':'')},txt);b.onclick=()=>{u.tab=k;draw()};return b}));
    body.replaceChildren(tabs,u.tab==='keys'?keysTab(p):u.tab==='models'?modelsTab(p):settingsTab(p));
  };
  draw();
  const d=h('details',{class:'prov'},
    h('summary',{},h('div',{class:'av',style:'background:'+color(p.name)},p.name[0]),h('b',{},p.name),
      badk?h('span',{class:'pill bad'},badk+' '+window.t('providers.invalid')):null,
      p.keys.length&&p.keys.every(k=>k.status==='nocredit')?h('span',{class:'pill bad'},window.t('providers.noCredit')):null,
      h('span',{class:'pill'},p.keys.length+' '+window.t('providers.keys')),
      h('span',{class:'pill'+(okc?' ok':'')},ms.length?okc+' '+window.t('providers.workingModel'):window.t('providers.notScanned'))),body);
  if(OPEN.has(p.name))d.open=true;
  d.addEventListener('toggle',()=>d.open?OPEN.add(p.name):OPEN.delete(p.name));
  return d;
}
async function render(){
  try{S=await api('GET','/state')}catch(e){toast(e.message,'bad');return}
  const app=$('#app');app.replaceChildren();
  const withKeys=S.providers.filter(p=>p.keys.length),without=S.providers.filter(p=>!p.keys.length);
  const tk=S.providers.reduce((a,p)=>a+p.keys.filter(k=>!k.disabled).length,0);
  const okm=S.providers.reduce((a,p)=>a+Object.values(p.models||{}).filter(m=>m.type==='chat'&&m.ok===true).length,0);
  $('#tiles').replaceChildren(...[[tk,window.t('tiles.activeKeys')],[withKeys.length,window.t('tiles.providers')],[okm,window.t('tiles.validModels')]].map(([n,t])=>h('div',{class:'tile'},h('b',{},String(n)),h('span',{},t))));
  const sc=h('button',{},'⚡ '+window.t('fullScan'));sc.onclick=()=>fullScan(sc);$('#scan').replaceChildren(sc);
  
  // Update title and subtitle
  const titleEl = $('#title');
  const subtitleEl = $('#subtitle');
  if (titleEl && titleEl.firstChild) titleEl.firstChild.textContent = window.t('admin.title');
  if (subtitleEl) subtitleEl.textContent = window.t('admin.subtitle');

  const ta=h('textarea',{placeholder:window.t('addProviderKeys.placeholder')});
  ta.ondragover=(e)=>{e.preventDefault();ta.classList.add('drag')};ta.ondragleave=()=>ta.classList.remove('drag');
  ta.ondrop=async(e)=>{e.preventDefault();ta.classList.remove('drag');const f=e.dataTransfer.files[0];if(f)ta.value+=(ta.value?'\n':'')+await f.text()};
  const add=h('button',{},window.t('addProviderKeys.button'));add.onclick=()=>addKeys(add,ta);
  app.append(h('section',{class:'card'},h('h2',{},window.t('addProviderKeys.title')),
    h('p',{class:'sub'},window.t('addProviderKeys.subtitle')),
    ta,h('div',{class:'row'},add),LAST.length?h('div',{class:'chips'},...LAST.map(chip)):null));

  const nm=h('input',{placeholder:window.t('projectKeys.placeholder')});
  const out=h('div',{});
  const mk=h('button',{},window.t('projectKeys.button'));
  mk.onclick=async()=>{
    if(!nm.value.trim())return;
    const r=await api('POST','/clients',{name:nm.value});
    await render();
    $('#newkey').replaceChildren(h('div',{class:'newkey'},h('b',{},window.t('projectKeys.copyNow')),h('code',{},r.key),h('button',{class:'sm',onclick:()=>copy(r.key)},window.t('projectKeys.copy'))))
  };
  app.append(h('section',{class:'card'},h('h2',{},window.t('projectKeys.title')),
    h('p',{class:'sub'},window.t('projectKeys.subtitle')),
    h('div',{class:'row'},nm,mk),h('div',{id:'newkey'}),
    S.clients.length?h('table',{},h('tr',{},...[window.t('projectKeys.name'),window.t('projectKeys.key'),window.t('projectKeys.requests'),''].map(x=>h('th',{},x))),
      ...S.clients.map(c=>{const b=h('button',{class:'bad sm'},window.t('projectKeys.delete'));b.onclick=()=>{if(confirm(window.t('projectKeys.deleteConfirm')))busy(b,'…',()=>api('DELETE','/clients/'+c.id))};
        return h('tr',{},h('td',{},c.name),h('td',{},h('code',{},c.prefix)),h('td',{},String(c.used||0)),h('td',{},b));})):null,
    h('div',{class:'row mut',style:'font-size:13px'},window.t('projectKeys.toConnect'),h('code',{},'OPENAI_BASE_URL=http://127.0.0.1:8787/v1'),
      h('button',{class:'ghost sm',onclick:()=>copy('OPENAI_BASE_URL=http://127.0.0.1:8787/v1')},window.t('projectKeys.copy')))));

  app.append(h('section',{class:'card'},h('h2',{},window.t('providers.title')),h('p',{class:'sub'},window.t('providers.subtitle')),
    ...(withKeys.length?withKeys.map(provider):[h('p',{class:'mut'},window.t('providers.noKeys'))]),
    without.length?h('details',{style:'margin-top:12px'},h('summary',{class:'mut'},window.t('providers.withoutKeys')+' ('+String(without.length)+')'),
      h('div',{class:'row'},...without.map(p=>h('span',{class:'pill'},p.name)))):null));

  // Analytics Section
  app.append(h('section',{class:'card'},h('h2',{},'Analytics'),h('p',{class:'sub'},'Usage metrics and performance data'),
    h('div',{id:'analytics-loading'},'Loading analytics...'),
    h('div',{id:'analytics-content',hidden:true},
      h('div',{class:'row'},h('b',{},'Total Requests: '),h('span',{},String(S.metrics?.total_requests||0))),
      h('div',{class:'row'},h('b',{},'Total Cost: '),h('span',{},'$'+(S.metrics?.total_cost||0).toFixed(2))),
      h('div',{class:'row'},h('b',{},'Avg Latency: '),h('span',{},String(Math.round(S.metrics?.avg_latency||0))+'ms')),
      h('div',{class:'row'},h('b',{},'Success Rate: '),h('span',{},String(Math.round((S.metrics?.success_rate||0)*100))+'%')),
      h('div',{style:'margin-top:20px'}),
      h('canvas',{id:'usageChart',style:'max-height:300px'}),
      h('div',{style:'margin-top:20px'}),
      h('h3',{},'Top Models by Usage'),
      h('ul',{},...(S.metrics?.top_models||[]).map(m=>h('li',{},h('code',{},m.model),' - '+String(m.total_requests||0)+' requests'))),
      h('div',{style:'margin-top:20px'}),
      h('h3',{},'Top Providers by Usage'),
      h('ul',{},...(S.metrics?.top_providers||[]).map(p=>h('li',{},h('code',{},p.provider_name),' - '+String(p.total_requests)+' requests'))
    )
  ));

  // Load analytics data
  (async()=>{
    try{
      const metrics=await api('GET','/metrics');
      const total=metrics.metrics.reduce((a,m)=>a+m.total_requests,0);
      const cost=metrics.metrics.reduce((a,m)=>a+m.total_cost,0);
      const avgLat=metrics.metrics.length>0 ? metrics.metrics.reduce((a,m)=>a+m.avg_latency,0)/metrics.metrics.length : 0;
      const successRate=total>0 ? metrics.metrics.reduce((a,m)=>a+m.success_count,0)/total : 0;
      const topModels=[...metrics.metrics].sort((a,b)=>b.total_requests-a.total_requests).slice(0,5);
      const topProviders=[...metrics.metrics].sort((a,b)=>b.total_requests-a.total_requests).slice(0,5);

      S.metrics={total_requests:total,total_cost:cost,avg_latency:avgLat,success_rate:successRate,top_models:topModels,top_providers:topProviders};
      $('#analytics-loading').hidden=true;
      $('#analytics-content').hidden=false;

      // Create chart
      const ctx=$('#usageChart').getContext('2d');
      new Chart(ctx,{
        type:'bar',
        data:{
          labels:topModels.map(m=>m.model),
          datasets:[{
            label:'Requests',
            data:topModels.map(m=>m.total_requests),
            backgroundColor:'rgba(99,102,241,0.6)',
            borderColor:'rgba(99,102,241,1)',
            borderWidth:1
          }]
        },
        options:{
          responsive:true,
          plugins:{legend:{display:false}},
          scales:{y:{beginAtZero:true}}
        }
      });
    }catch(e){
      $('#analytics-loading').textContent='Failed to load analytics: '+e.message;
    }
  })();

  const cn=h('input',{placeholder:window.t('advanced.name')}),cu=h('input',{placeholder:window.t('advanced.baseUrl')}),cm=h('input',{placeholder:window.t('advanced.defaultModel')});
  const ab=h('button',{},window.t('advanced.add'));ab.onclick=()=>busy(ab,'…',()=>api('PUT','/providers/'+cn.value.trim().toLowerCase(),{baseUrl:cu.value,defaultModel:cm.value}));
  app.append(h('details',{class:'card'},h('summary',{},window.t('advanced.title')),h('div',{class:'row'},cn,cu,cm,ab)));
}

// Initialize i18n and render
let i18nReady = false;
initI18n().then(() => {
  i18nReady = true;
  
  // Check if token is available (URL or localStorage)
  const urlToken = new URLSearchParams(window.location.search).get('token');
  const storedToken = localStorage.getItem('keyproxy-admin-token');
  
  if (urlToken) {
    localStorage.setItem('keyproxy-admin-token', urlToken);
    document.getElementById('adminTokenInput').value = urlToken;
    document.getElementById('tokenSection').hidden = true;
  } else if (storedToken) {
    document.getElementById('adminTokenInput').value = storedToken;
    document.getElementById('tokenSection').hidden = true;
  } else {
    document.getElementById('tokenSection').hidden = false;
  }
  
  // Call initial render after i18n is ready
  render();
});

function saveToken() {
  const token = document.getElementById('adminTokenInput').value;
  if (token) {
    localStorage.setItem('keyproxy-admin-token', token);
    document.getElementById('tokenSection').hidden = true;
    // Use the existing toast function
    const el = document.createElement('div');
    el.className = 'toast ok';
    el.textContent = 'تم حفظ التوكن';
    document.getElementById('toasts').appendChild(el);
    setTimeout(() => el.remove(), 3800);
    render();
  } else {
    const el = document.createElement('div');
    el.className = 'toast bad';
    el.textContent = 'الرجاء إدخال توكن';
    document.getElementById('toasts').appendChild(el);
    setTimeout(() => el.remove(), 7000);
  }
}

// Initial render will be called after i18n is ready
setInterval(()=>{if(S&&S.providers.some(p=>p.scanning)&&!document.activeElement?.matches('textarea,input,select'))render()},5000);
</script>
</html>
