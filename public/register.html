<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>إنشاء حساب - Kos Proxy</title>
  <style>
      :root {
        --bg: #fbf9f7;
        --card: #fff;
        --fg: #12141c;
        --mut: #6b7280;
        --bd: #e3e6ee;
        --ac: #ed1c24;
        --ac2: #b51224;
        --yellow: #f4c900;
        --sh: 0 12px 32px -14px rgba(30, 41, 59, 0.22);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #171311;
        --card: #12141e;
        --card2: #181b29;
        --fg: #eceef7;
        --mut: #8b91a8;
        --bd: #40362f;
        --ac: #ff4b4b;
        --ac2: #d51e31;
        --yellow: #ffdf42;
        --sh: 0 12px 32px -14px rgba(0, 0, 0, 0.7);
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font: 15px/1.5 "Segoe UI", system-ui, sans-serif;
      color: var(--fg);
      min-height: 100vh;
      background: radial-gradient(1100px 480px at 85% -10%, rgba(237, 28, 36, 0.12), transparent),
                  radial-gradient(800px 380px at 0% 0%, rgba(244, 201, 0, 0.14), transparent),
                  var(--bg);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--bd);
      border-radius: 18px;
      padding: 40px;
      margin: 20px;
      box-shadow: var(--sh);
      width: 100%;
      max-width: 400px;
    }
    h1 {
      margin: 0 0 10px;
      font-size: 28px;
      background: linear-gradient(135deg, var(--ac), var(--ac2));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      text-align: center;
    }
    .brand-sun { color: var(--yellow); -webkit-text-fill-color: var(--yellow); }
    .subtitle {
      color: var(--mut);
      text-align: center;
      margin-bottom: 30px;
    }
    .form-group {
      margin-bottom: 20px;
    }
    label {
      display: block;
      margin-bottom: 8px;
      color: var(--mut);
      font-weight: 500;
    }
    input {
      width: 100%;
      padding: 12px;
      border: 1px solid var(--bd);
      border-radius: 10px;
      background: var(--card2);
      color: var(--fg);
      outline: none;
      transition: border-color 0.15s, box-shadow 0.15s;
    }
    input:focus {
      border-color: var(--ac);
      box-shadow: 0 0 0 3px rgba(237, 28, 36, 0.16);
    }
    button {
      border: 0;
      border-radius: 12px;
      padding: 12px 24px;
      cursor: pointer;
      font: inherit;
      font-weight: 600;
      color: #fff;
      background: linear-gradient(135deg, var(--ac), var(--ac2));
      box-shadow: 0 6px 16px -8px rgba(237, 28, 36, 0.48);
      transition: transform 0.1s, opacity 0.15s;
      width: 100%;
      margin-top: 10px;
    }
    button:hover {
      transform: translateY(-1px);
    }
    button:active {
      transform: none;
    }
    button:disabled {
      opacity: 0.55;
      cursor: wait;
      transform: none;
    }
    button.secondary {
      background: var(--card2);
      color: var(--fg);
      border: 1px solid var(--bd);
      box-shadow: none;
      font-weight: 500;
    }
    .toggle {
      text-align: center;
      margin-top: 20px;
      color: var(--mut);
    }
    .toggle a {
      color: var(--ac);
      text-decoration: none;
    }
    .toggle a:hover {
      text-decoration: underline;
    }
    .error {
      background: #fee2e2;
      color: #dc2626;
      padding: 10px;
      border-radius: 8px;
      margin-bottom: 15px;
      text-align: center;
    }
    .success {
      background: #dcfce7;
      color: #00843d;
      padding: 10px;
      border-radius: 8px;
      margin-bottom: 15px;
      text-align: center;
    }
    .hint {
      font-size: 12px;
      color: var(--mut);
      margin-top: 5px;
    }
    .language-toggle {
      position: fixed;
      top: 18px;
      inset-inline-end: 18px;
      width: auto;
      margin: 0;
      padding: 8px 14px;
      background: var(--card);
      color: var(--fg);
      border: 1px solid var(--bd);
      box-shadow: none;
    }
    body::before { content: ""; position: fixed; z-index: 5; inset: 0 0 auto; height: 7px; background: linear-gradient(to bottom, #ed1c24 0 33.33%, #fff 33.33% 66.66%, #00843d 66.66%); }
  </style>
</head>
<body data-title-key="register.title">
  <button id="languageToggle" class="language-toggle" type="button">English</button>
  <div class="card">
    <h1><span class="brand-sun" aria-hidden="true">☀</span> Kos Proxy</h1>
    <p class="subtitle" data-i18n="register.subtitle">إنشاء حساب جديد</p>
    
    <div id="message"></div>
    
    <div class="form-group">
      <label data-i18n="register.username">اسم المستخدم</label>
      <input type="text" id="username" data-i18n-placeholder="register.usernamePlaceholder" placeholder="اختر اسم مستخدم فريد">
    </div>
    
    <div class="form-group">
      <label data-i18n="register.password">كلمة المرور</label>
      <input type="password" id="password" data-i18n-placeholder="register.passwordPlaceholder" placeholder="كلمة مرور قوية (8 أحرف على الأقل)">
      <div class="hint" data-i18n="register.passwordHint">كلمة المرور يجب أن تكون 8 أحرف على الأقل</div>
    </div>
    
    <div class="form-group">
      <label data-i18n="register.confirmPassword">تأكيد كلمة المرور</label>
      <input type="password" id="confirmPassword" data-i18n-placeholder="register.confirmPlaceholder" placeholder="أعد إدخال كلمة المرور">
    </div>
    
    <button id="registerBtn" onclick="register()" data-i18n="register.submit">إنشاء الحساب</button>
    
    <div class="toggle">
      <span data-i18n="register.hasAccount">لديك حساب بالفعل؟</span> <a href="/login.html" data-i18n="register.loginLink">تسجيل الدخول</a>
    </div>
  </div>

  <script>
    async function register() {
      const username = document.getElementById('username').value;
      const password = document.getElementById('password').value;
      const confirmPassword = document.getElementById('confirmPassword').value;
      const btn = document.getElementById('registerBtn');
      const message = document.getElementById('message');
      
      if (!username || !password || !confirmPassword) {
        showFormMessage('error', window.pageT('register.missingFields'));
        return;
      }
      
      if (password.length < 8) {
        showFormMessage('error', window.pageT('register.shortPassword'));
        return;
      }
      
      if (password !== confirmPassword) {
        showFormMessage('error', window.pageT('register.passwordMismatch'));
        return;
      }
      
      btn.disabled = true;
      btn.textContent = window.pageT('register.loading');
      
      try {
        const response = await fetch('/api/auth/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });
        
        const data = await response.json();
        
        if (data.success) {
          localStorage.setItem('keyproxy_token', data.token);
          localStorage.setItem('keyproxy_user', JSON.stringify(data.user));
          showFormMessage('success', window.pageT('register.registerSuccess'));
          setTimeout(() => {
            window.location.href = '/admin';
          }, 1000);
        } else {
          showFormMessage('error', data.message);
        }
      } catch (error) {
        showFormMessage('error', window.pageT('register.errorPrefix') + error.message);
      }
      
      btn.disabled = false;
      btn.textContent = window.pageT('register.submit');
    }

    function showFormMessage(kind, text) {
      const message = document.getElementById('message');
      const element = document.createElement('div');
      element.className = kind;
      element.textContent = text;
      message.replaceChildren(element);
    }
  </script>
  <script src="/language.js"></script>
</body>
</html>
