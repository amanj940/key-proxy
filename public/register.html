<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>إنشاء حساب - Key Proxy</title>
  <style>
    :root {
      --bg: #f3f4f9;
      --card: #fff;
      --fg: #12141c;
      --mut: #6b7280;
      --bd: #e3e6ee;
      --ac: #6366f1;
      --ac2: #8b5cf6;
      --sh: 0 12px 32px -14px rgba(30, 41, 59, 0.22);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #090a0f;
        --card: #12141e;
        --card2: #181b29;
        --fg: #eceef7;
        --mut: #8b91a8;
        --bd: #232738;
        --sh: 0 12px 32px -14px rgba(0, 0, 0, 0.7);
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font: 15px/1.5 "Segoe UI", system-ui, sans-serif;
      color: var(--fg);
      min-height: 100vh;
      background: radial-gradient(1100px 480px at 85% -10%, rgba(99, 102, 241, 0.2), transparent),
                  radial-gradient(800px 380px at 0% 0%, rgba(139, 92, 246, 0.14), transparent),
                  var(--bg);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--bd);
      border-radius: 18px;
      padding: 40px;
      margin: 20px;
      box-shadow: var(--sh);
      width: 100%;
      max-width: 400px;
    }
    h1 {
      margin: 0 0 10px;
      font-size: 28px;
      background: linear-gradient(135deg, var(--ac), var(--ac2));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      text-align: center;
    }
    .subtitle {
      color: var(--mut);
      text-align: center;
      margin-bottom: 30px;
    }
    .form-group {
      margin-bottom: 20px;
    }
    label {
      display: block;
      margin-bottom: 8px;
      color: var(--mut);
      font-weight: 500;
    }
    input {
      width: 100%;
      padding: 12px;
      border: 1px solid var(--bd);
      border-radius: 10px;
      background: var(--card2);
      color: var(--fg);
      outline: none;
      transition: border-color 0.15s, box-shadow 0.15s;
    }
    input:focus {
      border-color: var(--ac);
      box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.2);
    }
    button {
      border: 0;
      border-radius: 12px;
      padding: 12px 24px;
      cursor: pointer;
      font: inherit;
      font-weight: 600;
      color: #fff;
      background: linear-gradient(135deg, var(--ac), var(--ac2));
      box-shadow: 0 6px 16px -8px rgba(99, 102, 241, 0.8);
      transition: transform 0.1s, opacity 0.15s;
      width: 100%;
      margin-top: 10px;
    }
    button:hover {
      transform: translateY(-1px);
    }
    button:active {
      transform: none;
    }
    button:disabled {
      opacity: 0.55;
      cursor: wait;
      transform: none;
    }
    button.secondary {
      background: var(--card2);
      color: var(--fg);
      border: 1px solid var(--bd);
      box-shadow: none;
      font-weight: 500;
    }
    .toggle {
      text-align: center;
      margin-top: 20px;
      color: var(--mut);
    }
    .toggle a {
      color: var(--ac);
      text-decoration: none;
    }
    .toggle a:hover {
      text-decoration: underline;
    }
    .error {
      background: #fee2e2;
      color: #dc2626;
      padding: 10px;
      border-radius: 8px;
      margin-bottom: 15px;
      text-align: center;
    }
    .success {
      background: #dcfce7;
      color: #16a34a;
      padding: 10px;
      border-radius: 8px;
      margin-bottom: 15px;
      text-align: center;
    }
    .hint {
      font-size: 12px;
      color: var(--mut);
      margin-top: 5px;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>🔑 Key Proxy</h1>
    <p class="subtitle">إنشاء حساب جديد</p>
    
    <div id="message"></div>
    
    <div class="form-group">
      <label>اسم المستخدم</label>
      <input type="text" id="username" placeholder="اختر اسم مستخدم فريد">
    </div>
    
    <div class="form-group">
      <label>كلمة المرور</label>
      <input type="password" id="password" placeholder="كلمة مرور قوية (8 أحرف على الأقل)">
      <div class="hint">كلمة المرور يجب أن تكون 8 أحرف على الأقل</div>
    </div>
    
    <div class="form-group">
      <label>تأكيد كلمة المرور</label>
      <input type="password" id="confirmPassword" placeholder="أعد إدخال كلمة المرور">
    </div>
    
    <button id="registerBtn" onclick="register()">إنشاء الحساب</button>
    
    <div class="toggle">
      لديك حساب بالفعل؟ <a href="/login.html">تسجيل الدخول</a>
    </div>
  </div>

  <script>
    async function register() {
      const username = document.getElementById('username').value;
      const password = document.getElementById('password').value;
      const confirmPassword = document.getElementById('confirmPassword').value;
      const btn = document.getElementById('registerBtn');
      const message = document.getElementById('message');
      
      if (!username || !password || !confirmPassword) {
        message.innerHTML = '<div class="error">الرجاء ملء جميع الحقول</div>';
        return;
      }
      
      if (password.length < 8) {
        message.innerHTML = '<div class="error">كلمة المرور يجب أن تكون 8 أحرف على الأقل</div>';
        return;
      }
      
      if (password !== confirmPassword) {
        message.innerHTML = '<div class="error">كلمات المرور غير متطابقة</div>';
        return;
      }
      
      btn.disabled = true;
      btn.textContent = 'جاري إنشاء الحساب...';
      
      try {
        const response = await fetch('/api/auth/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });
        
        const data = await response.json();
        
        if (data.success) {
          localStorage.setItem('keyproxy_token', data.token);
          localStorage.setItem('keyproxy_user', JSON.stringify(data.user));
          message.innerHTML = '<div class="success">تم إنشاء الحساب بنجاح! جاري التحويل...</div>';
          setTimeout(() => {
            window.location.href = '/admin';
          }, 1000);
        } else {
          message.innerHTML = '<div class="error">' + data.message + '</div>';
        }
      } catch (error) {
        message.innerHTML = '<div class="error">حدث خطأ: ' + error.message + '</div>';
      }
      
      btn.disabled = false;
      btn.textContent = 'إنشاء الحساب';
    }
  </script>
</body>
</html>
